# ==============================================================================
# TASKFLOW - Render Blueprint Specification (render.yaml)
# Despliega TASKFLOW como un único Web Service gratuito en Render
# ==============================================================================

services:
  - type: web
    name: taskflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"
