# TASKFLOW Frontend — servidor estático para el build de Vite (doc §19)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Healthcheck interno del contenedor
  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  # SPA: todas las rutas las resuelve el router de Vue
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets de Vite con hash: caché de larga duración
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
