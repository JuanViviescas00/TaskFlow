# TASKFLOW — Docker Compose (doc §9-§11, §19, HU-13)
#
# Servicios:
#   frontend | backend | worker | redisserver
#   (MongoDB -> MongoDB Atlas, nube, sin contenedor local)
#
# Comunicación por NOMBRES DE SERVICIO (doc §10):
#   backend → redisserver:6379
#   worker  → redisserver:6379 | backend:3000
#
# Puertos publicados — documentados en backend/README.md:
#   frontend: 8080 → 80      backend: 3001 → 3000
#   redisserver: 6380 → 6379

services:
  redisserver:
    image: redis:7-alpine
    container_name: taskflow-redisserver
    ports:
      - "6380:6379"                   # Anfitrión 6380 → contenedor 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [taskflow]

  backend:
    build: ./backend
    container_name: taskflow-backend
    environment:
      PORT: "3000"
      # ⚠️  Reemplaza con tu connection string de MongoDB Atlas
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: redis://redisserver:6379
      CORS_ORIGIN: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174"
    ports:
      - "3001:3000"                   # Anfitrión 3001 → contenedor 3000
    depends_on:
      redisserver:
        condition: service_healthy
    networks: [taskflow]

  # Worker independiente (doc regla 6): servicio propio aislado en /worker, sin exposición HTTP
  worker:
    build: ./worker
    container_name: taskflow-worker
    environment:
      # ⚠️  Reemplaza con tu connection string de MongoDB Atlas
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: redis://redisserver:6379
      BACKEND_URL_PARA_WORKER: http://backend:3000
      WORKER_INTERVALO_MS: "500"
    depends_on:
      redisserver:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      disable: true
    networks: [taskflow]

  frontend:
    build: ./frontend
    container_name: taskflow-frontend
    ports:
      - "8080:80"                     # Anfitrión 8080 → contenedor 80
    depends_on:
      backend:
        condition: service_started
    networks: [taskflow]

networks:
  taskflow:
    driver: bridge
